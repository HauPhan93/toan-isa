<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thử giọng ISA</title>
<style>
  :root { --teal: #12A39E; --ink: #1E3A4C; --ink-2: #5B7280; --line: #DCE7EA; --orange: #F47A2A; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 600 17px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #EAF7F6; }
  main { max-width: 640px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p { margin: 6px 0 14px; color: var(--ink-2); font-weight: 500; }
  label { display: block; font-weight: 800; margin: 14px 0 6px; }
  select { width: 100%; height: 48px; font: inherit; border-radius: 12px; border: 2px solid var(--line); padding: 0 10px; background: #fff; color: var(--ink); }
  .v { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 16px; padding: 12px 14px; margin: 10px 0; box-shadow: 0 2px 8px rgba(0, 40, 50, .08); }
  .v b { font-size: 26px; color: var(--orange); width: 28px; text-align: center; flex: none; }
  .v div { flex: 1; min-width: 0; }
  .v small { display: block; color: var(--ink-2); font-weight: 500; font-size: 14px; }
  button { height: 48px; min-width: 92px; border: 0; border-radius: 14px; background: var(--teal); color: #fff; font: 800 17px system-ui, sans-serif; flex: none; }
  button:active { transform: translateY(2px); }
  .none { padding: 14px; border-radius: 14px; background: #FFF6DB; color: #7A5600; }
  a { color: var(--teal); }
</style>
</head>
<body>
<main>
  <h1>🔊 Thử giọng ISA</h1>
  <p>Chọn giọng <b>Linh (Nâng cao)</b>, rồi bấm nghe từng cách đọc. Cho mình biết <b>số</b> nào đọc rõ chữ "Bé" nhất nhé.</p>
  <label for="voice">Giọng</label>
  <select id="voice"></select>
  <div id="status"></div>
  <div id="list"></div>
  <p style="margin-top:18px"><a href="./">← Về Toán ISA</a></p>
</main>
<script>
(() => {
  const LINE = 'Bé ơi, lớp 1 nè!';
  // Each way differs in one thing only, so the one that sounds right tells what the voice needs.
  const WAYS = [
    { text: ', ' + LINE, rate: 0.88, what: 'Cách cũ (có dấu phẩy ở đầu, chậm 0,88)' },
    { text: LINE, rate: 0.88, what: 'Bỏ dấu phẩy ở đầu' },
    { text: LINE, rate: 1, what: 'Bỏ dấu phẩy, tốc độ bình thường — app đang đọc như cách này' },
    { text: 'bé ơi, lớp 1 nè!', rate: 0.88, what: 'Chữ "bé" viết thường' },
    { text: LINE, rate: 0.88, warm: true, what: 'Phát một tiếng im lặng trước, rồi mới đọc' },
    { text: 'Bé ơi. Lớp 1 nè!', rate: 0.88, what: 'Ngắt câu sau "Bé ơi"' },
  ];
  const sel = document.getElementById('voice'), list = document.getElementById('list'), status = document.getElementById('status');
  if (!('speechSynthesis' in window)) { list.innerHTML = '<div class="none">Trình duyệt này không đọc được.</div>'; return; }
  let voices = [];
  function load() {
    voices = speechSynthesis.getVoices().filter(v => /^vi/i.test(v.lang));
    const keep = sel.value;
    sel.innerHTML = '';
    voices.forEach((v, i) => { const o = document.createElement('option'); o.value = String(i); o.textContent = v.name; sel.append(o); });
    const enh = voices.findIndex(v => /Nâng cao|Enhanced|Cao cấp|Premium/i.test(v.name));
    sel.value = keep && voices[Number(keep)] ? keep : String(enh >= 0 ? enh : 0);
    status.innerHTML = voices.length ? '' : '<div class="none">Máy này chưa có giọng tiếng Việt (hoặc đang tải danh sách giọng…).</div>';
  }
  function say(w) {
    const v = voices[Number(sel.value)];
    speechSynthesis.cancel();
    let done = false;
    const go = () => {
      if (done) return; done = true;
      const u = new SpeechSynthesisUtterance(w.text.normalize('NFC'));
      u.lang = 'vi-VN'; if (v) u.voice = v; u.pitch = 1; u.rate = w.rate;
      speechSynthesis.speak(u);
    };
    if (w.warm) {
      const s = new SpeechSynthesisUtterance(' . ');
      s.lang = 'vi-VN'; if (v) s.voice = v; s.volume = 0;
      s.onend = go; s.onerror = go;
      speechSynthesis.speak(s);
      setTimeout(go, 900);   // some devices never report the end of a silent line
    } else setTimeout(go, 120);
  }
  WAYS.forEach((w, i) => {
    const row = document.createElement('div'); row.className = 'v';
    row.innerHTML = `<b>${i + 1}</b><div>${w.text.replace(/^, /, '')}<small>${w.what}</small></div>`;
    const b = document.createElement('button'); b.textContent = '▶ Nghe'; b.onclick = () => say(w);
    row.append(b); list.append(row);
  });
  load();
  speechSynthesis.onvoiceschanged = load;
})();
</script>
</body>
</html>
